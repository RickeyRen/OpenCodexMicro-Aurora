<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codex Bridge Setup</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    html, body { margin: 0; background: transparent; color: #e8e8e8; font-size: 13px; }
    * { box-sizing: border-box; }
    main { padding: 12px 14px 10px; }
    h1 { margin: 0 0 5px; font-size: 15px; font-weight: 650; }
    .intro { margin: 0 0 10px; color: #aeb3ba; line-height: 1.35; }
    .panel { border: 1px solid rgba(255,255,255,.12); border-radius: 8px; overflow: hidden; background: rgba(255,255,255,.035); }
    .row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; min-height: 37px; padding: 7px 10px; border-bottom: 1px solid rgba(255,255,255,.08); }
    .row:last-child { border-bottom: 0; }
    .value { display: inline-flex; align-items: center; gap: 6px; color: #aeb3ba; text-align: right; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #72777f; box-shadow: 0 0 0 2px rgba(114,119,127,.15); }
    .value.good { color: #75d6a3; }
    .value.good .dot { background: #42c985; box-shadow: 0 0 0 2px rgba(66,201,133,.15); }
    .value.warn { color: #f0bc68; }
    .value.warn .dot { background: #e6a84b; box-shadow: 0 0 0 2px rgba(230,168,75,.15); }
    .value.bad { color: #ef8585; }
    .value.bad .dot { background: #e45f5f; box-shadow: 0 0 0 2px rgba(228,95,95,.15); }
    .message { min-height: 18px; margin: 8px 1px 4px; color: #aeb3ba; line-height: 1.35; }
    .message.error { color: #ef8585; }
    .message.success { color: #75d6a3; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 8px; }
    button { min-height: 33px; border: 1px solid rgba(255,255,255,.14); border-radius: 6px; color: #f3f3f3; background: rgba(255,255,255,.08); cursor: pointer; }
    button:hover:not(:disabled) { background: rgba(255,255,255,.13); }
    button.primary { border-color: #3f78bd; background: #2867ad; }
    button.primary:hover:not(:disabled) { background: #3276bf; }
    button.danger { grid-column: 1 / -1; color: #ef9a9a; border-color: rgba(228,95,95,.35); background: rgba(228,95,95,.08); }
    button.danger:hover:not(:disabled) { background: rgba(228,95,95,.16); }
    button:disabled { cursor: default; opacity: .45; }
    details.info { margin-top: 10px; border: 1px solid rgba(255,255,255,.1); border-radius: 7px; background: rgba(255,255,255,.025); }
    details.info summary { padding: 9px 10px; color: #d5d8dc; cursor: pointer; font-weight: 600; }
    .info-body { padding: 0 10px 10px; color: #9fa5ad; line-height: 1.45; }
    .info-body p { margin: 7px 0; }
    .info-body code { display: block; margin: 7px 0; padding: 7px 8px; overflow-wrap: anywhere; border-radius: 5px; color: #dce7f6; background: rgba(0,0,0,.28); user-select: text; }
    .runtime { color: #c7d3e2; }
    .signature-note { color: #e3b971; }
    .version { margin-top: 7px; color: #777e87; font-size: 11px; text-align: right; }
    [hidden] { display: none !important; }
    .conversation { margin-bottom: 18px; }
    .conversation-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 7px; }
    .conversation-head h2 { margin: 0; font-size: 14px; font-weight: 650; }
    .conversation-number { border: 1px solid rgba(255,255,255,.16); border-radius: 5px; padding: 2px 6px; color: #c4cfdd; font-variant-numeric: tabular-nums; }
    .conversation-title { margin: 0 0 10px; color: #bdc5d0; font-size: 12px; line-height: 1.45; overflow-wrap: anywhere; user-select: text; }
    .alias-label { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 5px; color: #d6dbe2; }
    .alias-count { color: #89929f; font-variant-numeric: tabular-nums; }
    textarea { display: block; width: 100%; min-height: 58px; max-height: 110px; padding: 8px 9px; resize: vertical; border: 1px solid rgba(255,255,255,.19); border-radius: 6px; background: rgba(0,0,0,.2); color: #fff; font: inherit; line-height: 1.4; }
    textarea:focus { outline: 2px solid #418bdb; outline-offset: 1px; }
    textarea:disabled { opacity: .5; }
    .conversation .message { font-size: 12px; margin-bottom: 0; }
  </style>
</head>
<body>
  <main>
    <section id="conversationSection" class="conversation" hidden>
      <div class="conversation-head"><h2 id="conversationHeading"></h2><span id="conversationNumber" class="conversation-number">—</span></div>
      <p id="conversationTitle" class="conversation-title"></p>
      <label class="alias-label" for="conversationAlias"><span id="conversationAliasLabel"></span><span id="conversationAliasCount" class="alias-count">0 / 16</span></label>
      <textarea id="conversationAlias" rows="2" disabled spellcheck="false"></textarea>
      <div class="actions"><button id="saveConversationAlias" class="primary" disabled></button><button id="resetConversationAlias" disabled></button></div>
      <p id="conversationLabelMessage" class="message" role="status"></p>
    </section>
    <h1 id="title"></h1>
    <p id="intro" class="intro"></p>
    <section class="panel">
      <div class="row"><span id="appLabel"></span><span id="appValue" class="value"><i class="dot"></i><span></span></span></div>
      <div class="row"><span id="serviceLabel"></span><span id="serviceValue" class="value"><i class="dot"></i><span></span></span></div>
      <div class="row"><span id="cdpLabel"></span><span id="cdpValue" class="value"><i class="dot"></i><span></span></span></div>
    </section>
    <div id="message" class="message"></div>
    <div class="actions">
      <button id="install" class="primary"></button>
      <button id="launch"></button>
      <button id="refresh"></button>
      <button id="guide"></button>
      <button id="uninstall" class="danger"></button>
    </div>
    <details class="info">
      <summary id="bridgeAppInfoTitle"></summary>
      <div class="info-body">
        <p id="bridgeAppDescription"></p>
        <code>--remote-debugging-address=127.0.0.1<br>--remote-debugging-port=9222<br>--remote-allow-origins=http://127.0.0.1:9222</code>
        <p id="bridgeAppSafety"></p>
      </div>
    </details>
    <details class="info">
      <summary id="backgroundTitle"></summary>
      <div class="info-body">
        <p id="launchAgentDescription"></p>
        <p id="nodeSelectionStrategy"></p>
        <p id="nodeInstallRecommendation"></p>
        <code>brew install node</code>
        <p id="ulanziNodeSignatureNotice" class="signature-note"></p>
        <p id="currentNodeRuntime" class="runtime"></p>
      </div>
    </details>
    <div id="version" class="version"></div>
  </main>

      de: { heading:"Chat-Beschriftung", alias:"Kurzer Name auf der Taste", placeholder:"z. B. API-Fix oder Website", save:"Namen speichern", reset:"Automatischen Namen nutzen", hint:"Maximal 16 Zeichen in zwei Zeilen. Empfohlen: 3 CJK-Zeichen oder 8 lateinische Buchstaben pro Zeile. Längerer Text wird gekürzt; die Nummer bleibt beim Chat.", empty:"Dieser Taste ist kein Chat zugeordnet.", saved:"Kurzname gespeichert.", resetDone:"Automatischer Name wiederhergestellt.", invalid:"Maximal 16 Zeichen in zwei Zeilen, ohne Steuerzeichen.", stale:"Die Taste zeigt jetzt einen anderen Chat. Titel prüfen und erneut versuchen.", storage:"Der Name konnte nicht lokal gespeichert werden. Verbindung prüfen und erneut versuchen.", capacity:"Das Beschriftungslimit ist erreicht. Bestehende Chat-Nummern bleiben erhalten.", timeout:"Noch keine Antwort. Verbindung prüfen und erneut versuchen." },
      ko: { heading:"대화 표시 이름", alias:"키에 표시할 짧은 이름", placeholder:"예: API 수정, 웹사이트", save:"이름 저장", reset:"자동 이름 사용", hint:"최대 16자, 두 줄입니다. 한 줄에 전각 3자 또는 영문 8자를 권장합니다. 긴 표시는 축약되며 번호는 대화에 고정됩니다.", empty:"이 키에 지정된 대화가 없습니다.", saved:"짧은 이름을 저장했습니다.", resetDone:"자동 이름으로 복원했습니다.", invalid:"제어 문자 없이 최대 16자, 두 줄로 입력하세요.", stale:"이 키가 다른 대화로 바뀌었습니다. 제목을 확인하고 다시 시도하세요.", storage:"이름을 로컬에 저장할 수 없습니다. 연결을 확인하고 다시 시도하세요.", capacity:"표시 이름 수가 한도에 도달했습니다. 기존 대화 번호는 유지됩니다.", timeout:"응답이 없습니다. 연결을 확인하고 다시 시도하세요." },
      pt: { heading:"Nome da conversa", alias:"Nome curto na tecla", placeholder:"Ex.: API ou Website", save:"Guardar nome", reset:"Usar nome automático", hint:"Até 16 caracteres em duas linhas. Recomendado: 3 caracteres CJK ou 8 letras latinas por linha. O texto longo é abreviado; o número acompanha a conversa.", empty:"Não existe uma conversa atribuída a esta tecla.", saved:"Nome curto guardado.", resetDone:"Nome automático restaurado.", invalid:"Use até 16 caracteres em duas linhas, sem caracteres de controlo.", stale:"A tecla mostra agora outra conversa. Verifique o título e tente novamente.", storage:"Não foi possível guardar o nome localmente. Verifique a ligação e tente novamente.", capacity:"Foi atingido o limite de nomes. Os números existentes foram mantidos.", timeout:"Sem resposta. Verifique a ligação e tente novamente." },
      es: { heading:"Etiqueta de conversación", alias:"Nombre corto en la tecla", placeholder:"Ej.: API o Sitio web", save:"Guardar nombre", reset:"Usar nombre automático", hint:"Hasta 16 caracteres en dos líneas. Se recomiendan 3 caracteres CJK u 8 letras latinas por línea. El texto largo se abrevia; el número permanece con la conversación.", empty:"No hay una conversación asignada a esta tecla.", saved:"Nombre corto guardado.", resetDone:"Nombre automático restaurado.", invalid:"Usa hasta 16 caracteres en dos líneas, sin caracteres de control.", stale:"La tecla muestra ahora otra conversación. Comprueba el título e inténtalo de nuevo.", storage:"No se pudo guardar el nombre localmente. Comprueba la conexión e inténtalo de nuevo.", capacity:"Se alcanzó el límite de etiquetas. Se conservaron los números existentes.", timeout:"Sin respuesta. Comprueba la conexión e inténtalo de nuevo." }
    };
    const query = new URLSearchParams(location.search);
    const rawLanguage = (query.get("language") || "en-US").replace(/_/g, "-");
    const locale = rawLanguage.startsWith("zh-HK") || rawLanguage.startsWith("zh-TW") ? "zh_HK" : rawLanguage.startsWith("zh") ? "zh_CN" : rawLanguage.split(/[-_]/)[0];
    const t = { ...TEXT.en, ...(TEXT[locale] || {}) };
    const labelText = LABEL_TEXT[locale] || LABEL_TEXT.en;
    const connection = {
      address: query.get("address") || "127.0.0.1",
      port: query.get("port") || "3906",
      uuid: query.get("uuid") || "com.ulanzi.ulanzistudio.codexmicro.task1",
      actionid: query.get("actionid") || "",
      key: query.get("key") || ""
    };
    let socket;
    let latestStatus;
    let busy = false;
    let pollTimer;
    const conversationLabelsEnabled = /\.(?:task(?:[1-9]|1[0-3])|navigate)$/.test(connection.uuid);
    const aliasSegmenter = new Intl.Segmenter(undefined, { granularity:"grapheme" });
    let currentConversation = null;
    let aliasDirty = false;
    let pendingAliasWrite = null;
    let aliasWriteTimer;

    async function loadLocalizedResources() {
      const resource = { en:"en", zh_CN:"zh_CN", zh_HK:"zh_HK", ja:"ja_JP", de:"de_DE", ko:"ko_KR", pt:"pt_PT", es:"es_ES" }[locale] || "en";
      try {
        const response = await fetch(`../${resource}.json`);
        const localized = (await response.json()).Localization || {};
        Object.assign(t, {
          title: localized.BridgeSetup || t.title,
          intro: localized.BridgeSetupDescription || t.intro,
          app: localized.BridgeApp || t.app,
          service: localized.BridgeService || t.service,
          cdp: localized.CDPConnection || t.cdp,
          install: localized.InstallRepair || t.install,
          launch: localized.LaunchBridge || t.launch,
          uninstall: localized.UninstallBridge || t.uninstall,
          uninstalling: localized.UninstallingBridge || t.uninstalling,
          uninstallDone: localized.UninstallBridgeDone || t.uninstallDone,
          uninstallConfirm: localized.UninstallBridgeConfirm || t.uninstallConfirm,
          bridgeAppInfoTitle: localized.BridgeAppInfoTitle || t.bridgeAppInfoTitle,
          bridgeAppDescription: localized.BridgeAppDescription || t.bridgeAppDescription,
          bridgeAppSafety: localized.BridgeAppSafety || t.bridgeAppSafety,
          backgroundTitle: localized.BackgroundActivityTitle || t.backgroundTitle,
          launchAgentDescription: localized.LaunchAgentDescription || t.launchAgentDescription,
          nodeSelectionStrategy: localized.NodeSelectionStrategy || t.nodeSelectionStrategy,
          nodeInstallRecommendation: localized.NodeInstallRecommendation || t.nodeInstallRecommendation,
          ulanziNodeSignatureNotice: localized.UlanziNodeSignatureNotice || t.ulanziNodeSignatureNotice,
          currentNode: localized.CurrentNodeRuntime || t.currentNode,
          systemNode: localized.SystemNode || t.systemNode,
          ulanziNode: localized.UlanziNode || t.ulanziNode,
          unknownNode: localized.UnknownNode || t.unknownNode,
          refresh: localized.CheckAgain || t.refresh,
          guide: localized.InstallationGuide || t.guide
        });
      } catch {
        // The embedded translations remain available when local fetch is unavailable.
      }
    }

    function text(id, value) { document.getElementById(id).textContent = value; }
    function setValue(id, value, level) {
      const element = document.getElementById(id);
      element.className = `value ${level || ""}`;
      element.querySelector("span").textContent = value;
    }
    function format(template, values) { return template.replace(/\{(\w+)\}/g, (_, key) => values[key] || "—"); }
    function send(action) {
      if (socket?.readyState !== WebSocket.OPEN) return;
      socket.send(JSON.stringify({ cmd:"sendToPlugin", uuid:connection.uuid, actionid:connection.actionid, key:connection.key, payload:{ type:"bridgeSetup", action } }));
    }
    function normalizedAlias() { return document.getElementById("conversationAlias").value.replace(/\r\n?/g, "\n").trim(); }
    function validAlias(value) { return [...aliasSegmenter.segment(value)].length <= 16 && value.split("\n").length <= 2 && !/[\p{Cc}\u2028\u2029]/u.test(value.replace(/\n/g, "")); }
    function labelMessage(value, level = "") {
      text("conversationLabelMessage", value);
      document.getElementById("conversationLabelMessage").className = `message ${level}`;
    }
    function conversationLabelError(payload) {
      const translation = {
        STALE_CONVERSATION:labelText.stale,
        LABEL_STORAGE_ERROR:labelText.storage,
        INVALID_CONVERSATION_LABEL:labelText.invalid,
        LABEL_CAPACITY_REACHED:labelText.capacity
      }[payload.errorCode];
      return typeof translation === "string" ? translation : payload.error ? `${t.failed}: ${payload.error}` : "";
    }
    function updateAliasControls() {
      const field = document.getElementById("conversationAlias");
      const alias = normalizedAlias();
      const valid = validAlias(alias);
      text("conversationAliasCount", `${[...aliasSegmenter.segment(alias)].length} / 16`);
      field.disabled = !currentConversation?.threadKey || Boolean(pendingAliasWrite);
      document.getElementById("saveConversationAlias").disabled = field.disabled || !aliasDirty || !valid;
      document.getElementById("resetConversationAlias").disabled = field.disabled || !(currentConversation?.alias || field.value);
      if (!valid) labelMessage(labelText.invalid, "error");
    }
    function sendConversationLabel(action) {
      if (!conversationLabelsEnabled || socket?.readyState !== WebSocket.OPEN) return;
      const payload = { type:"conversationLabel", action };
      if (action !== "status") {
        if (!currentConversation?.threadKey) return;
        if (action === "save" && !validAlias(normalizedAlias())) return;
        payload.threadKey = currentConversation.threadKey;
        if (action === "save") payload.alias = normalizedAlias();
        pendingAliasWrite = { threadKey:payload.threadKey, alias:action === "reset" ? "" : payload.alias, action };
        clearTimeout(aliasWriteTimer);
        aliasWriteTimer = setTimeout(() => {
          pendingAliasWrite = null;
          updateAliasControls();
          labelMessage(labelText.timeout, "error");
        }, 8000);
        updateAliasControls();
        labelMessage(t.checking);
      }
      socket.send(JSON.stringify({ cmd:"sendToPlugin", uuid:connection.uuid, actionid:connection.actionid, key:connection.key, payload }));
    }
    function renderConversationLabel(payload) {
      if (!conversationLabelsEnabled) return;
      const errorMessage = conversationLabelError(payload);
      const previousKey = currentConversation?.threadKey;
      const changedConversation = previousKey !== payload.threadKey;
      currentConversation = { threadKey:payload.threadKey || null, title:String(payload.title || ""), identifier:String(payload.identifier || ""), alias:String(payload.alias || "") };
      text("conversationTitle", currentConversation.threadKey ? currentConversation.title || "—" : labelText.empty);
      text("conversationNumber", currentConversation.identifier ? `#${currentConversation.identifier}` : "—");
      if (changedConversation || !aliasDirty) {
        document.getElementById("conversationAlias").value = currentConversation.alias;
        aliasDirty = false;
      }
      if (errorMessage || changedConversation && pendingAliasWrite) {
        pendingAliasWrite = null;
        clearTimeout(aliasWriteTimer);
      }
      let completedAction;
      if (pendingAliasWrite?.threadKey === currentConversation.threadKey && pendingAliasWrite.alias === currentConversation.alias) {
        completedAction = pendingAliasWrite.action;
        document.getElementById("conversationAlias").value = currentConversation.alias;
        pendingAliasWrite = null;
        aliasDirty = false;
        clearTimeout(aliasWriteTimer);
      }
      updateAliasControls();
      if (errorMessage) labelMessage(errorMessage, "error");
      else if (completedAction) labelMessage(completedAction === "reset" ? labelText.resetDone : labelText.saved, "success");
      else if (!aliasDirty && !pendingAliasWrite) labelMessage(labelText.hint);
    }
    function render(status, payload = {}) {
      latestStatus = status;
      busy = Boolean(payload.busy);
      setValue("appValue", status.installed ? (status.needsUpdate ? t.update : t.installed) : t.notInstalled, status.installed ? (status.needsUpdate ? "warn" : "good") : "bad");
      setValue("serviceValue", status.serviceOnline ? t.online : t.offline, status.serviceOnline ? "good" : "bad");
      setValue("cdpValue", status.cdpConnected ? t.connected : t.disconnected, status.cdpConnected ? "good" : "warn");
      const install = document.getElementById("install");
      const launch = document.getElementById("launch");
      const uninstall = document.getElementById("uninstall");
      install.textContent = busy && payload.operation === "install" ? t.installing : t.install;
      launch.textContent = busy && payload.operation === "launch" ? t.launching : t.launch;
      uninstall.textContent = busy && payload.operation === "uninstall" ? t.uninstalling : t.uninstall;
      install.disabled = busy || !status.supported;
      launch.disabled = busy || !status.installed || status.cdpConnected;
      uninstall.disabled = busy || !status.supported || !status.installed;
      document.getElementById("refresh").disabled = busy;
      let message = !status.supported ? t.unsupported : !status.installed || status.needsUpdate ? t.needInstall : !status.serviceOnline ? t.serviceOffline : !status.cdpConnected ? t.needLaunch : t.ready;
      let level = status.cdpConnected && status.installed && !status.needsUpdate ? "success" : "";
      if (payload.result === "install") { message = t.installDone; level = "success"; }
      if (payload.result === "launch") { message = t.launchDone; level = "success"; }
      if (payload.result === "uninstall") { message = t.uninstallDone; level = "success"; }
      if (payload.error) { message = `${t.failed}: ${payload.error}`; level = "error"; }
      text("message", message);
      document.getElementById("message").className = `message ${level}`;
      text("version", format(t.version, { installed:status.installedVersion, bundled:status.bundledVersion }));
      const runtime = status.nodeSource === "system" ? t.systemNode : status.nodeSource === "ulanzi" ? t.ulanziNode : t.unknownNode;
      text("currentNodeRuntime", format(t.currentNode, { runtime, version:status.nodeVersion }));
    }
    function connect() {
      socket = new WebSocket(`ws://${connection.address}:${connection.port}`);
      socket.addEventListener("open", () => {
        socket.send(JSON.stringify({ code:0, cmd:"connected", uuid:connection.uuid }));
        send("status");
        sendConversationLabel("status");
        clearInterval(pollTimer);
        pollTimer = setInterval(() => { send("status"); sendConversationLabel("status"); }, 2000);
      });
      socket.addEventListener("message", event => {
        const message = JSON.parse(event.data);
        if (message.cmd === "sendToPropertyInspector" && message.payload?.type === "bridgeSetupStatus") render(message.payload.status, message.payload);
        if (message.cmd === "sendToPropertyInspector" && message.payload?.type === "conversationLabelStatus") renderConversationLabel(message.payload);
      });
      socket.addEventListener("close", () => {
        clearInterval(pollTimer);
        setTimeout(connect, 1000);
      });
    }

    async function start() {
      await loadLocalizedResources();
      document.getElementById("conversationSection").hidden = !conversationLabelsEnabled;
      text("conversationHeading", labelText.heading); text("conversationAliasLabel", labelText.alias); text("conversationTitle", t.checking);
      text("saveConversationAlias", labelText.save); text("resetConversationAlias", labelText.reset); labelMessage(labelText.hint);
      document.getElementById("conversationAlias").placeholder = labelText.placeholder;
      document.getElementById("conversationAlias").addEventListener("input", () => {
        aliasDirty = normalizedAlias() !== (currentConversation?.alias || "");
        labelMessage(labelText.hint);
        updateAliasControls();
      });
      document.getElementById("saveConversationAlias").addEventListener("click", () => sendConversationLabel("save"));
      document.getElementById("resetConversationAlias").addEventListener("click", () => sendConversationLabel("reset"));
      text("title", t.title); text("intro", t.intro); text("appLabel", t.app); text("serviceLabel", t.service); text("cdpLabel", t.cdp);
      text("bridgeAppInfoTitle", t.bridgeAppInfoTitle); text("bridgeAppDescription", t.bridgeAppDescription); text("bridgeAppSafety", t.bridgeAppSafety); text("backgroundTitle", t.backgroundTitle); text("launchAgentDescription", t.launchAgentDescription); text("nodeSelectionStrategy", t.nodeSelectionStrategy); text("nodeInstallRecommendation", t.nodeInstallRecommendation); text("ulanziNodeSignatureNotice", t.ulanziNodeSignatureNotice); text("currentNodeRuntime", format(t.currentNode, { runtime:t.unknownNode }));
      text("install", t.install); text("launch", t.launch); text("uninstall", t.uninstall); text("refresh", t.refresh); text("guide", t.guide); text("message", t.checking);
      setValue("appValue", t.checking); setValue("serviceValue", t.checking); setValue("cdpValue", t.checking);
      document.getElementById("install").addEventListener("click", () => { if (confirm(t.confirm)) send("install"); });
      document.getElementById("launch").addEventListener("click", () => send("launch"));
      document.getElementById("uninstall").addEventListener("click", () => { if (confirm(t.uninstallConfirm)) send("uninstall"); });
      document.getElementById("refresh").addEventListener("click", () => send("status"));
      document.getElementById("guide").addEventListener("click", () => send("openGuide"));
      connect();
    }
    void start();
  </script>
